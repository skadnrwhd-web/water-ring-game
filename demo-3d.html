<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#06172b">
<title>Water Ring Toss 3D — Demo</title>
<style>
:root{color-scheme:dark;--cyan:#76f0ff;--gold:#ffd36b;--panel:rgba(7,24,46,.78)}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#06172b;color:#eefaff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
body{background:radial-gradient(ellipse at 50% 0%,#164e78 0%,#06172b 65%)}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hud{position:fixed;z-index:2;left:0;right:0;top:0;padding:calc(14px + env(safe-area-inset-top)) 16px 12px;display:flex;justify-content:space-between;align-items:center;gap:10px;pointer-events:none}
.brand{font-weight:900;letter-spacing:.08em;font-size:clamp(12px,2.5vw,17px);text-shadow:0 2px 14px #001a2c}
.brand span{color:var(--cyan)}
.stats{display:flex;gap:8px}
.stat{min-width:76px;padding:8px 12px;border:1px solid #a5efff42;border-radius:14px;background:var(--panel);backdrop-filter:blur(10px);text-align:center;box-shadow:0 8px 28px #00101f55}
.stat small{display:block;font-size:10px;color:#a8d6e8;letter-spacing:.12em}
.stat b{font-size:20px;color:var(--gold);font-variant-numeric:tabular-nums}
.bottom{position:fixed;z-index:2;left:0;right:0;bottom:0;padding:16px 18px calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:10px;pointer-events:none}
.hint{background:var(--panel);border:1px solid #a5efff35;border-radius:999px;padding:9px 15px;font-size:12px;color:#d4f6ff;text-align:center;backdrop-filter:blur(10px);max-width:94vw}
.controls{display:flex;gap:10px;pointer-events:auto}
button{border:0;border-radius:14px;padding:13px 20px;font:800 14px system-ui;cursor:pointer;box-shadow:0 5px 0 #083b54;transition:transform .1s,filter .1s}
button:active{transform:translateY(3px);box-shadow:0 2px 0 #083b54}
#launch{color:#062132;background:linear-gradient(135deg,#b4fbff,#46d6ef);min-width:150px}
#reset{color:#e5f9ff;background:#153d5a;border:1px solid #75dfff55;box-shadow:none}
.overlay{position:fixed;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;padding:22px;background:linear-gradient(#03132355,#031323bb);backdrop-filter:blur(7px)}
.panel{width:min(440px,100%);border:1px solid #9defff55;border-radius:26px;padding:28px;background:linear-gradient(145deg,#123c5cF2,#071a30F5);box-shadow:0 25px 100px #0009;text-align:center}
.kicker{color:var(--cyan);font-size:11px;font-weight:900;letter-spacing:.2em}
h1{font-size:clamp(30px,7vw,48px);line-height:1.04;margin:12px 0 14px;letter-spacing:-.04em}
.panel p{color:#c1e1ef;line-height:1.7;font-size:14px}
#start{width:100%;margin-top:10px;padding:16px;background:linear-gradient(135deg,#b4fbff,#46d6ef);color:#062132;font-size:16px}
.note{font-size:11px!important;color:#8eb5c9!important}
@media(max-width:520px){.hud{padding-left:10px;padding-right:10px;align-items:flex-start}.brand{max-width:105px;line-height:1.3}.stat{min-width:61px;padding:7px 8px}.stat b{font-size:17px}.bottom{padding-left:10px;padding-right:10px}.hint{font-size:11px}}
</style>
</head>
<body>
<canvas id="scene" aria-label="3D water ring toss game"></canvas>
<div class="hud"><div class="brand">WATER RING<br><span>TOSS / 3D</span></div><div class="stats"><div class="stat"><small>SCORE</small><b id="score">000</b></div><div class="stat"><small>TIME</small><b id="time">60</b></div><div class="stat"><small>BEST</small><b id="best">000</b></div></div></div>
<div class="bottom"><div class="hint" id="hint">화면을 좌우로 움직여 조준하고 링 발사 버튼을 누르세요.</div><div class="controls"><button id="reset">다시 시작</button><button id="launch">◎ 링 발사</button></div></div>
<div class="overlay" id="intro"><div class="panel"><div class="kicker">ARCADE CLASSIC · REIMAGINED</div><h1>WATER RING<br><span style="color:#76f0ff">TOSS 3D</span></h1><p>반짝이는 수조 속에서 링을 기둥에 걸어 보세요.<br>조준하고 발사해 제한 시간 안에 최고 점수에 도전하세요.</p><button id="start">게임 시작하기</button><p class="note">데모 버전 · PC 마우스 / 모바일 터치 지원</p></div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const canvas=document.querySelector('#scene');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;
const scene=new THREE.Scene();scene.fog=new THREE.FogExp2(0x082947,.035);
const camera=new THREE.PerspectiveCamera(43,innerWidth/innerHeight,.1,100);camera.position.set(0,5.3,12.7);camera.lookAt(0,1.6,0);
scene.add(new THREE.HemisphereLight(0xb9f4ff,0x08213e,2.1));
const key=new THREE.DirectionalLight(0xffffff,3.1);key.position.set(-4,9,6);key.castShadow=true;scene.add(key);
const fill=new THREE.PointLight(0x28c9ff,38,18);fill.position.set(4,3,2);scene.add(fill);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(200,200),new THREE.MeshStandardMaterial({color:0x06172b,roughness:.4,metalness:.2}));floor.rotation.x=-Math.PI/2;floor.position.y=-.18;floor.receiveShadow=true;scene.add(floor);
const tank=new THREE.Group();scene.add(tank);
const base=new THREE.Mesh(new THREE.BoxGeometry(7.4,.38,5.3),new THREE.MeshStandardMaterial({color:0x0c4264,metalness:.55,roughness:.25}));base.position.set(0,.15,0);base.castShadow=true;base.receiveShadow=true;tank.add(base);
const water=new THREE.Mesh(new THREE.BoxGeometry(7.12,3.8,5.02),new THREE.MeshPhysicalMaterial({color:0x078dcc,transparent:true,opacity:.18,roughness:.12,metalness:.1,transmission:.18,thickness:.4,side:THREE.DoubleSide}));water.position.set(0,2.05,0);tank.add(water);
const edges=new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(7.18,4,5.08)),new THREE.LineBasicMaterial({color:0x70eaff,transparent:true,opacity:.58}));edges.position.set(0,2.05,0);tank.add(edges);
const sand=new THREE.Mesh(new THREE.BoxGeometry(7.05,.08,4.95),new THREE.MeshStandardMaterial({color:0xc1a66b,roughness:1}));sand.position.set(0,.38,0);tank.add(sand);
const postMat=new THREE.MeshStandardMaterial({color:0xffd36b,metalness:.65,roughness:.22,emissive:0x5c3100,emissiveIntensity:.25});
const postPositions=[[-2.25,1.05,-1.1],[-1.12,1.05,-1.1],[0,1.05,-1.1],[1.12,1.05,-1.1],[2.25,1.05,-1.1]];
const posts=[];
for(let i=0;i<postPositions.length;i++){const [x,y,z]=postPositions[i];const p=new THREE.Mesh(new THREE.CylinderGeometry(.075,.11,1.25,20),postMat);p.position.set(x,y,z);p.castShadow=true;p.receiveShadow=true;tank.add(p);posts.push(p);const foot=new THREE.Mesh(new THREE.CylinderGeometry(.23,.23,.09,24),new THREE.MeshStandardMaterial({color:0x18769a,metalness:.35,roughness:.3}));foot.position.set(x,.47,z);tank.add(foot);const glow=new THREE.PointLight(0x29cfff,1.8,1.3);glow.position.set(x,1.8,z);tank.add(glow)}
const coralMat=new THREE.MeshStandardMaterial({color:0xff718b,roughness:.7});
for(let i=0;i<11;i++){const x=-3.1+(i%6)*1.22,z=i<6?1.7:1.1;const c=new THREE.Mesh(new THREE.ConeGeometry(.16+Math.random()*.13,.4+Math.random()*.45,7),coralMat);c.position.set(x,.65+c.geometry.parameters.height/2,z);c.rotation.z=(Math.random()-.5)*.4;tank.add(c)}
const pebbleMat=new THREE.MeshStandardMaterial({color:0xd8cfaa,roughness:.8});
for(let i=0;i<36;i++){const p=new THREE.Mesh(new THREE.SphereGeometry(.035+Math.random()*.055,8,6),pebbleMat);p.position.set((Math.random()-.5)*6.7,.45,(Math.random()-.5)*4.5);p.scale.y=.45;tank.add(p)}
const bubbles=[];for(let i=0;i<28;i++){const b=new THREE.Mesh(new THREE.SphereGeometry(.025+Math.random()*.035,10,8),new THREE.MeshBasicMaterial({color:0xb8f5ff,transparent:true,opacity:.55}));b.position.set((Math.random()-.5)*6.6,.5+Math.random()*3.2,(Math.random()-.5)*4.6);b.userData.speed=.25+Math.random()*.55;scene.add(b);bubbles.push(b)}
const ringColors=[0xff5470,0xffd34d,0x42e6c5,0x8a78ff,0xff8fdb];
function makeRing(color){const g=new THREE.TorusGeometry(.31,.075,12,36);const m=new THREE.MeshStandardMaterial({color,metalness:.35,roughness:.23,emissive:color,emissiveIntensity:.13});const o=new THREE.Mesh(g,m);o.castShadow=true;o.userData={velocity:new THREE.Vector3(),flight:false,life:0};return o}
let rings=[],score=0,time=60,playing=false,aimX=0,aimZ=-1.1,last=0,spawnWait=0,best=Number(localStorage.getItem('wrt3d-best')||0);
document.querySelector('#best').textContent=String(best).padStart(3,'0');
const scoreEl=document.querySelector('#score'),timeEl=document.querySelector('#time'),hint=document.querySelector('#hint');
function updateHud(){scoreEl.textContent=String(score).padStart(3,'0');timeEl.textContent=String(Math.ceil(time)).padStart(2,'0');document.querySelector('#best').textContent=String(best).padStart(3,'0')}
function addRing(){const r=makeRing(ringColors[Math.floor(Math.random()*ringColors.length)]);r.position.set(aimX,.75,3.2);r.rotation.x=Math.PI/2;r.userData.flight=true;r.userData.velocity.set((aimX-r.position.x)*.3,2.5,-7.4);r.userData.life=0;scene.add(r);rings.push(r);hint.textContent='링 발사! 기둥에 걸리도록 조준해 보세요.'}
function launch(){if(!playing)return;addRing()}
function start(){score=0;time=60;playing=true;document.querySelector('#intro').style.display='none';rings.forEach(r=>scene.remove(r));rings=[];updateHud();hint.textContent='화면을 좌우로 움직여 조준하고 링 발사 버튼을 누르세요.';last=performance.now()}
document.querySelector('#start').addEventListener('click',start);document.querySelector('#reset').addEventListener('click',()=>{document.querySelector('#intro').style.display='flex';start();document.querySelector('#intro').style.display='flex';playing=false});document.querySelector('#launch').addEventListener('click',launch);
function aimFromPointer(e){const rect=canvas.getBoundingClientRect();const nx=(e.clientX-rect.left)/rect.width;aimX=THREE.MathUtils.clamp((nx-.5)*6.2,-2.9,2.9)}
canvas.addEventListener('pointermove',aimFromPointer);canvas.addEventListener('pointerdown',e=>{aimFromPointer(e);if(playing&&e.pointerType==='touch')launch()});
const raycaster=new THREE.Raycaster(),mouse=new THREE.Vector2();
function resize(){renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()}addEventListener('resize',resize);
function animate(now){requestAnimationFrame(animate);const dt=Math.min((now-last)/1000||0,.04);last=now;
for(const b of bubbles){b.position.y+=b.userData.speed*dt;if(b.position.y>4.3){b.position.y=.45;b.position.x=(Math.random()-.5)*6.5}}
tank.rotation.y=Math.sin(now*.00035)*.035;
posts.forEach((p,i)=>{p.rotation.z=Math.sin(now*.001+i)*.018});
for(let i=rings.length-1;i>=0;i--){const r=rings[i];if(r.userData.flight){r.userData.life+=dt;r.userData.velocity.y-=5.8*dt;r.position.addScaledVector(r.userData.velocity,dt);r.rotation.x+=dt*5;r.rotation.y+=dt*2;
if(r.position.z<-1.0&&r.position.z>-1.55){for(const p of posts){const dx=r.position.x-p.position.x;if(Math.abs(dx)<.22&&r.position.y>p.position.y-.48&&r.position.y<p.position.y+.52){r.userData.flight=false;r.position.set(p.position.x,p.position.y+.52,p.position.z);r.rotation.set(Math.PI/2,0,0);score+=10;hint.textContent='성공! +10점 ✨';if(score>best){best=score;localStorage.setItem('wrt3d-best',best)}updateHud();break}}}
if(r.position.y<.48||r.userData.life>2.3){if(r.userData.flight){scene.remove(r);rings.splice(i,1)}}}
}
if(playing){time-=dt;if(time<=0){time=0;playing=false;hint.textContent='시간 종료! 다시 시작을 눌러 최고 점수에 도전하세요.';updateHud()}}
renderer.render(scene,camera)}
requestAnimationFrame(animate);
</script>
</body>
</html>
